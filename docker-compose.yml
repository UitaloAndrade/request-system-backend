services:
  postgres:
    image: postgres:17-alpine
    container_name: requestsystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_requestsystem}
      POSTGRES_USER: ${POSTGRES_USER:-requestsystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-requestsystem_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: requestsystem-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: requestsystem-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-requestsystem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-requestsystem}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-requestsystem_dev}
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?Configure SECURITY_JWT_SECRET no arquivo .env}
      SECURITY_JWT_EXPIRATION_SECONDS: ${SECURITY_JWT_EXPIRATION_SECONDS:-3600}
      ELASTICSEARCH_OUTBOX_DELAY_MS: ${ELASTICSEARCH_OUTBOX_DELAY_MS:-2000}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v3/api-docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

volumes:
  postgres_data:
  elasticsearch_data:
