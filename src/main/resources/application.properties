spring.application.name=requestsystem

# Carrega o .env.example local, caso exista
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${APP_PROFILE:test}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:db_requestsystem}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:requestsystem}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:requestsystem_dev}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
app.elasticsearch.outbox-delay-ms=${ELASTICSEARCH_OUTBOX_DELAY_MS:2000}

security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}