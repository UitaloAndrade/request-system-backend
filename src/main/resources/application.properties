spring.application.name=requestsystem

spring.profiles.active=${APP_PROFILE:test}

# Carrega o .env.example local, caso exista
spring.config.import=optional:file:.env[.properties]

# Configuração do banco: PostgreSQL por padrão
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_requestsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}