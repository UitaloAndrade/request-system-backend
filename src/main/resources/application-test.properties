spring.application.name=requestsystem

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:db_requestsystem_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Client
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dialeto H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Executar migrations nos testes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:h2:mem:db_requestsystem_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.flyway.user=sa
spring.flyway.password=

security.jwt.secret=e7Ja+HWEfUmC5KFaaAHy7rQtKWS48QyG60Bl97aP/8s=
security.jwt.expiration-seconds=3600